<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Mortgage agent architecture on Red Hat OpenShift AI</title>
<desc id="desc">The mortgage agent and project-scoped MLflow workspace belong to mlflow-demo. The agent logs traces and loads the production prompt from its workspace, and calls Qwen through KServe, llm-d, and vLLM in llm-inference. A workbench or local CLI evaluates traces with an external OpenAI judge. The logical workspace is served by shared MLflow in redhat-ods-applications.</desc>
